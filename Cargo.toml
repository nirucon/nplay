[package]
name = "nplay"
version = "2.0.2"
edition = "2021"
rust-version = "1.85"
description = "Terminal music, radio and podcast player built around mpv, with a local control service"
license = "MIT"
repository = "https://github.com/nirucon/nplay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }
lofty = "0.22"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
toml = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
regex-lite = "0.1"
md-5 = "0.10"
sha2 = "0.10"
fastrand = "2"
unicode-width = "0.2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
