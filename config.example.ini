[general]
music_dirs = ~/Music
youtube_enabled = true
navidrome_enabled = true
sr_enabled = true
custom_radio_enabled = true
auto_library_refresh = true
navidrome_url =
navidrome_user =
navidrome_bitrate = 0
visualizer = true
visualizer_style = classic
kitty_artwork = true
now_playing_view = normal
theme = niru-noir

# Playback quality
normalization = true
normalization_mode = auto
replaygain_preamp = 0
replaygain_clip = true
gapless = false
shuffle_mode = off
repeat_mode = off

# Linux desktop integration
track_notifications = true
notification_artwork = true
mpris_enabled = true
artwork_cache_mb = 500
preferred_source = local

# Optional Spotify Web API + local librespot / Spotify Connect integration
spotify_enabled = false
spotify_client_id =
spotify_playback = local
spotify_local_name = NPLAY
spotify_local_backend = pulseaudio
spotify_local_bitrate = 320
spotify_local_volume = 70

[keys]
play_pause = SPACE
search = /
browse = b
command = :
help = ?
quit = Q
